name: Review gate

# base が`develop`と`main`のPull Requestを対象にする。
#
# `develop`側で掛けないと、宣言はsquash commitにしか現れず、review後にcommitを足しても
# 何も落ちない。**宣言が無効になる仕組みは、Pull Requestのhead commitを見て初めて働く。**
#
# **`gate`はbase が`develop`のPull Requestだけで走らせる。**base が`main`では
# `history`だけを走らせる。`gate`はhead commit 1本の宣言を範囲全体のdiffへ当てるため、
# **満たされ方が2通りあってどちらも保証になっていない。**`d9d9711`は指示sourceを
# 0 path触りながら`Instruction-Change`を持っており（儀式として付いていた）、
# `59a77df`は正しく付けなかったために落ちた
# （[#316](https://github.com/wachi-yoshitaka-11-dev/deskcat/pull/316)）。
# **偽陽性と偽陰性の両方を出すcheckは保証を持たない。**保証はcommit単位に置く。
# それが`history`である。**`history`が範囲の各commitを見るようになったのが理由であり、
# 偽陽性が煩わしいからではない。**
#
# 検証するのは分類と自己レビューの宣言だけである。**未解決threadと必要CIは検証しない。**
# どちらもbranch protectionが強制しており、同じ条件を2箇所で持つと、片方だけを見た判断が
# 起きる（ADR-0007の「GitHubまたは設定で強制できるものはそちらへ寄せる」）。
on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Verify change class and self-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commit messageのtrailerを読むため、履歴を切り詰めない。
          fetch-depth: 0
          # このstepの後にPR側のscriptを実行する。checkoutが残すtokenを
          # そのscriptから読めないようにする。
          persist-credentials: false

      - name: Verify change class and self-review declarations
        # base が`develop`のPull Requestだけで実行する。**base が`main`では
        # `history`が範囲の各commitを見る**（免除commitの指示source変更も含む。
        # `review_gate.py`の`_check_exempt_instructions`）。head commit 1本へ
        # 範囲全体を当てる検査は、そこでは保証を足さず偽陽性と偽陰性だけを足す。
        # **順序が意味を持つ。**`history`が免除commitを覆う前にこのstepを外すと、
        # その間の昇格が無検査で通る。
        if: ${{ github.base_ref != 'main' }}
        # 値は環境変数で渡す。`run`へ直接展開すると、branch名やshaがshellの構文として
        # 解釈される余地が残る。
        env:
          # base は remote-tracking ref ではなくshaで渡す。`origin/main`が
          # checkout後に存在するとは限らない。
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/review_gate.py gate \
            --base "$GATE_BASE" --head "$GATE_HEAD"

      - name: Verify every commit in the promotion range
        # base が`main`のPull Requestだけで実行する。範囲に複数のsquash commitが入るため、
        # head commitだけでは宣言を持たないcommitが混ざっても通る。
        #
        # **`develop`側では実行しない。**feature branchの中間commitにまで宣言を要求すると、
        # 最後にまとめて宣言する運用が成立しない。
        if: ${{ github.base_ref == 'main' }}
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/review_gate.py history \
            --base "$GATE_BASE" --head "$GATE_HEAD"

  report-closing-keywords:
    name: Report closing keywords in the promotion range
    # 別jobにする。`report_promotion_closing_keywords.py`はgit操作が失敗した場合に
    # exit 1になりうる（`guards.ValidationError`）。`gate` jobの1 stepとして
    # 組み込むと、報告scriptの失敗が`Verify change class and self-review`という
    # 名前のcheckを赤くし、宣言の失敗と見分けが付かなくなる。**「報告のみで
    # mergeを止めない」という設計を、job名の分離によりCI側でも成立させる**（#305）。
    #
    # base が`main`のPull Requestだけで実行する。範囲内commitの`Closes #N`等は
    # Pull Request本文（`closingIssuesReferences`）からは検出できず、merge時に発火する
    # （#289）。**このjob自体が赤くなっても、mergeを止める強制力は無い**
    # （`required_status_checks`は`null`。[Repository設定](../REPOSITORY_SETTINGS.md)）。
    if: ${{ github.base_ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report closing keywords
        # `--check-issue-state`は付けない（`persist-credentials: false`により
        # このjobは`gh`の認証を持たない）。
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/report_promotion_closing_keywords.py \
            --base "$GATE_BASE" --head "$GATE_HEAD"
