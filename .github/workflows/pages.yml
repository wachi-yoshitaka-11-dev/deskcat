name: Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "pages/**"
      - "scripts/prepare-pages.ps1"
      - "scripts/validate-pages-output.ps1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "pages/**"
      - "scripts/prepare-pages.ps1"
      - "scripts/validate-pages-output.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare public source
        shell: pwsh
        run: ./scripts/prepare-pages.ps1

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./.pages-src
          destination: ./_site

      - name: Validate output
        shell: pwsh
        run: ./scripts/validate-pages-output.ps1 -SiteRoot ./_site

      # 公開境界の回帰test。未宣言asset、追跡外asset、hash不一致、size超過で
      # stagingが失敗することを確認する。`_site`は既に検証済みで影響しない。
      - name: Test publish guards
        shell: pwsh
        run: ./scripts/test-pages-guards.ps1

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    name: Deploy
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
