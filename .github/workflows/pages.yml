name: Pages

on:
  pull_request:
    paths:
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "pages/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "pages/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Pull Requestでは、この後のstepがPR側の検証scriptを実行する。
          # checkoutが.git/configへ残すtokenを、そのscriptから読めないようにする。
          persist-credentials: false

      # PowerShellからPythonへの移行中である（ADR-0006）。旧実装を削除する前に、
      # 新旧を両方実行して同等性を確認する。`DIGEST`は「件数だけでは環境によって
      # 走査範囲が変わっても`BROKEN=0`が揃う」という理由で用意されており、
      # 移行の同等性検査にそのまま使える。出力行全体の一致を必須にする。
      - name: Check documentation links
        shell: bash
        run: |
          set -euo pipefail
          legacy="$(pwsh -NoProfile -File ./scripts/validate-doc-links.ps1)"
          current="$(python3 scripts/validate_doc_links.py)"
          printf 'legacy:  %s\ncurrent: %s\n' "$legacy" "$current"
          if [ "$legacy" != "$current" ]; then
            echo 'Documentation link validation diverged between the PowerShell and Python implementations.' >&2
            exit 1
          fi

      - name: Test link validators
        shell: bash
        # harnessがrepository rootをcurrent directoryとして暗黙に要求しないことを
        # CIで回帰させる。script自体はcheckoutの絶対pathから起動する。
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/test-link-validators.ps1"
          python3 "$GITHUB_WORKSPACE/scripts/test_link_validators.py"

      # 旧実装を先に実行し、Python実装で`.pages-src/`を上書きする。
      # Jekyllがbuildするのは新実装の出力である。
      - name: Prepare public source
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./scripts/prepare-pages.ps1
          python3 scripts/prepare_pages.py

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./.pages-src
          destination: ./_site

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./scripts/validate-pages-output.ps1 -SiteRoot ./_site
          python3 scripts/validate_pages_output.py --site-root ./_site

      # 公開境界の回帰test。未宣言asset、追跡外asset、hash不一致、size超過で
      # stagingが失敗することを確認する。`_site`は既に検証済みで影響しない。
      - name: Test publish guards
        shell: bash
        # `PAGES_SOURCE=.pages-src`はcallerのCWDではなくrepository root基準で
        # 解決する。test harness内のexact-path assertionを非root CWDで実行する。
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/test-pages-guards.ps1"
          python3 "$GITHUB_WORKSPACE/scripts/test_pages_guards.py"

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    name: Deploy
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
