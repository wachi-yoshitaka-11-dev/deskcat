<text x="521.3" y="474.3" font-size="10" fill="#c00">T1</text>
<polyline points="586.8,533.8 680.9,658.8" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="639.8" y="608.3" font-size="10" fill="#c00">T2</text>
<polyline points="357.0,542.2 444.3,691.7 464.3,689.0" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="406.6" y="628.9" font-size="10" fill="#c00">T3</text>
<rect x="260" y="230" width="130" height="300" rx="6" fill="#eef4ff" stroke="#335"/>
<text x="266" y="246" font-size="11" font-weight="bold">電源の基板 PROTO-02</text>
<text x="266" y="260" font-size="9" fill="#555">左の壁の内側に立てる</text>
<text x="266" y="273" font-size="9" fill="#555">C1 C2 F1 J5 J6 J7 J8 Q1 R18 R20 W1</text>
<rect x="50" y="220" width="150" height="50" rx="6" fill="#eef4ff" stroke="#335"/>
<text x="56" y="236" font-size="11" font-weight="bold">AC アダプター M-12001</text>
<text x="56" y="250" font-size="9" fill="#555">左の壁の後ろ寄りの穴から線が入る</text>
<text x="56" y="263" font-size="9" fill="#555">PS1</text>
<rect x="1060" y="230" width="120" height="180" rx="6" fill="#eef4ff" stroke="#335"/>
<text x="1066" y="246" font-size="11" font-weight="bold">Raspberry Pi Zero W</text>
<text x="1066" y="260" font-size="9" fill="#555">右の壁の内側の後ろ寄りに立てる</text>
<text x="1066" y="273" font-size="9" fill="#555">J4 J9</text>
<rect x="460" y="440" width="230" height="80" rx="6" fill="#eef4ff" stroke="#335"/>
<text x="466" y="456" font-size="11" font-weight="bold">B2（BB-601。LCD の14本を受ける）</text>
<text x="466" y="470" font-size="9" fill="#555">床の B1 の後ろ</text>
<text x="466" y="483" font-size="9" fill="#555">R1 R2 R3 R6</text>
<rect x="460" y="580" width="330" height="110" rx="6" fill="#eef4ff" stroke="#335"/>
<text x="466" y="596" font-size="11" font-weight="bold">B1（EIC-3901。ESP32）</text>
<text x="466" y="610" font-size="9" fill="#555">床の前寄り</text>
<text x="466" y="623" font-size="9" fill="#555">D1 D2 R4 R5 R7 R8 R9 R12 R13 R14 R15 R16 R17 R19 U1</text>
<rect x="840" y="750" width="260" height="60" rx="6" fill="#eef4ff" stroke="#335"/>
<text x="846" y="766" font-size="11" font-weight="bold">B3（BB-601。ENV-01・ACCEL-01）</text>
<text x="846" y="780" font-size="9" fill="#555">前の壁の内側に立てる</text>
<text x="846" y="793" font-size="9" fill="#555">J2 J3 R10 R11</text>
<rect x="620" y="645" width="200" height="55" rx="6" fill="#fff3dd" fill-opacity="0.9" stroke="#335" stroke-dasharray="5 3"/>
<text x="626" y="661" font-size="11" font-weight="bold">LCD（DISP-01）</text>
<text x="626" y="675" font-size="9" fill="#555">頭。背板の前の面（ふたの上、サーボの前寄り）</text>
<text x="626" y="688" font-size="9" fill="#555">J1</text>
<rect x="650" y="490" width="140" height="60" rx="6" fill="#fff3dd" fill-opacity="0.9" stroke="#335" stroke-dasharray="5 3"/>
<text x="656" y="506" font-size="11" font-weight="bold">サーボ（SERVO-01）</text>
<text x="656" y="520" font-size="9" fill="#555">ふたの上の天板。軸は胴の真ん中</text>
<text x="656" y="533" font-size="9" fill="#555">M1</text>
<text x="16" y="840" font-size="10" fill="#444">細い線＝1本ずつ（ID。サーボは黄・赤・茶）。太い線＝束（本数）。各線の節点と端は wiring-table.md。赤の破線＝TBD。描かない物：#18 の試験だけの物（端子台S、PSU、試験用の負荷、試験用の shunt。PROTO-02 の R20 とは別）。</text>
<text x="16" y="854" font-size="10" fill="#c00">T1: サーボの plug とのつなぎ方（servo の枝の線の先）：#405</text>
<text x="16" y="868" font-size="10" fill="#c00">T2: LCD の VCC（pin 1）の電圧：今の構成（3V3 pin、J1 開放）は #461 の承認範囲で、段階Cへ広げない（段階Cでは DISP-01 を使わない）。最終は、`HW-TBD-024`・`HW-TBD-025`(a) と回路図の版の一致が揃えば #405</text>
<text x="16" y="882" font-size="10" fill="#c00">T3: J8 の枝（P7・X5）の線とつなぎの部材（ESP32 board の `5V` pin・GND pin へ。ブレッドボードの接点とジャンパー線は使わない）と、案Bで 5V-NODE に載る B1 の上の要素（`J2-19` の列の接点、ADC-5V の分圧の上の抵抗（回路図の</text>
<text x="16" y="896" font-size="10" fill="#c00"> R8、B1 の配線表の R11）とその接点・線（B1 の配線表の S18 を含む））の扱い：#405。決まるまで J8 から ESP32 へ給電しない</text>
<text x="16" y="910" font-size="10" fill="#c00">HW-TBD-038（#405）が閉じるまで：(a) R20 の開放に備えて、W1 を GPIO32 につながず（P8）、J6 から servo へ給電しない（P3）。(b) 案Bで J8−（X5）だけが外れたときに備えて、J8 から ESP32 へ給電しない（P7）。</text>
</svg>
