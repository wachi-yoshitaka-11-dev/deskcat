<polyline points="321.5,230.0 325.0,216.5 1123.5,220.0 1123.5,230.0" fill="none" stroke="#d62728" stroke-width="2.4"/>
<polyline points="328.5,230.0 325.0,223.5 1116.5,220.0 1116.5,230.0" fill="none" stroke="#111111" stroke-width="2.4"/>
<text x="728.5" y="215.0" font-size="10" fill="#222">P5・P6</text>
<polyline points="391.2,399.7 651.2,491.9" fill="none" stroke="#d62728" stroke-width="2.4"/>
<polyline points="388.8,406.3 648.8,498.5" fill="none" stroke="#8c564b" stroke-width="2.4"/>
