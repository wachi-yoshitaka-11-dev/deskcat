# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbitの自動reviewを行わない。
#
# 判断と経緯は[ADR-0013](docs/decisions/0013-manual-only-coderabbit-review.md)にある。
# 以前はlabel allowlistで高リスク変更だけを自動reviewしていた（ADR-0007の決定1）。
# **その運用を廃止した。**reviewは、意味上criticalな変更に対して自己レビューの後で
# 手動で依頼する。手順は`CONTRIBUTING.md`の「手動で依頼する前に状態を確認する」にある。
#
# `enabled: false`だけを置く。`labels`と`base_branches`はauto reviewの発火条件であり、
# 発火させないなら意味を持たない。**効かない設定を残すと、次に読む人が
# 「labelを付ければ走る」と読む。**

reviews:
  auto_review:
    enabled: false
