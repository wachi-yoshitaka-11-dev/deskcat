[package]
name = "deskcat-esp32"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"
license = "MIT"
publish = false

[[bin]]
name = "deskcat-esp32"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[features]
# **製品buildは既定build（featureなし）である**（#487）。Pi link、LCDの表情描画、
# tap入力、heartbeat／health snapshotを1本のmain loopで回す。安全値がTBDのservo出力はまだ有効にしない。
# 下に列挙した試験featureを指定すると既存の試験構成を選ぶ。各試験featureは加える向きにする。
# 例外は`bench-servo-test-17`だけであり、Pi linkを外す（下の注記）。
# 構成の一覧は`src/main.rs`のmodule doc「buildの構成」節が持つ。
# #487のPR B1まであった`pi-protocol-mode`（Pi linkを持つbuild。LCD／I2Cと排他）は廃止した。
default = []
# ACCEL-01／ENV-01のID読み出しだけを試す。旧・featureなしbuildのI/Oを保つ。
# LCD関連pinとADXL345の設定には触れない。Pi linkとhealthは維持する。
bringup-i2c-15-16 = []
# #16 の raw／補償値観測専用。BME280 の ID 一致後だけ forced 測定を書き込む。
env-sample-16 = []
# env-sample-16 の変換を遅い設定（温度・気圧・湿度とも oversampling ×16）にする。#16 の
# 「遅い変換が上位 task を block しない」の実機観察用。env-sample-16 を含み、単独の試験 build として使う。
env-sample-16-slow = ["env-sample-16"]
# env-sample-16-slow の変換（×16）を、最初の変換の開始から30秒、130 ms 周期で繰り返す。#16 の「遅い変換が上位 task を
# block しない」を、変換が heartbeat の時刻を何度もまたぐ状態で観察する。env-sample-16-slow を含み、
# 単独の試験 build として使う。env-sample-16／-slow の動き（起動ごとに1回）は変えない。
env-sample-16-repeat = ["env-sample-16-slow"]
# #15 の ADXL345 連続測定専用。Device ID が 0xE5 のときだけ設定を書き、FIFO を読んで
# raw 値と静止時の統計を UART0 に出す。他の試験 feature とは併用しない。
accel-sample-15 = []
# Issue #17の単発servo bench試験だけを有効にする。既定ではoffであり、
# 通常のbuildはこのfeatureを持たず`crate::servo`を呼ばない。承認の状態は
# `docs/hardware/servo-safety-limits.md`の`承認の状態`節を参照する（ここへ再掲しない。
# `main.rs`のmodule doc、`servo.rs`のmodule doc参照）。
# **このfeature付きbuildはPi linkを持たない。**同文書の`測定のための駆動（承認の状態の項目6）`節が、
# 測定用のbuildは「Piとの通信linkを持たない」と定めているためである。#487でfeatureの排他をやめた
# ときの、ただ1つの例外である（featureどうしの排他ではない。このbuildはPi linkを外すだけであり、
# `bringup-display-13`と組み合わせることは禁じていない。ただしPi linkで`tapped`を送る`tap-21`とは併用できず、`main.rs`の`compile_error!`で止める）。
bench-servo-test-17 = []
# #17の90度指令用。元のbench構成を含み、指令角だけを規約上の中央にする。
bench-servo-90-17 = ["bench-servo-test-17"]
# Issue #13の`DISP-01`（MSP2807）bring-up（初期化、backlight点灯、単色fill、
# 四隅pattern）の試験構成を選ぶ。このfeatureだけを指定したbuildは表情とtapを有効にしない。
# 有効化してよい条件・手順は`main.rs`のmodule docの
# 「`DISP-01`のbring-upを有効にする手順」節を参照する（ここへ再掲しない）。
# #487から、fillと四隅patternはmain loopの中で1段ずつ進む（`src/display_test.rs`。描画の間の
# Pi linkの受信とheartbeatは、同fileのmodule docを参照）。
bringup-display-13 = []
# Issue #514の追加LED（`LED-COMM`＝白／GPIO2、`LED-REACT`＝赤／GPIO5）を駆動する。
# 既定ではoffであり、通常のbuildはGPIO2／GPIO5に触れない。起動時に点灯試験
# （赤→白→両方）を行い、その後は白を点滅させる（`src/led.rs`のmodule doc）。
# 配線と試験の手順は`docs/hardware/led-514-demo.md`。`bringup-display-13`とも組み合わせられる。
bringup-led-514 = []
# Issue #21のdemo。LCDを初期化してbacklightを点け、そのまま点けておき、PiからのExpression command
# （`set_expression`）で表情を描き替える（`src/face.rs`）。製品buildもこの経路を持つ。
# `bringup-display-13`とも組み合わせられる（その場合、bring-upが終わった後に
# driverを手放さず、表情の描画へ渡す。bring-upの試験手順は変えない）。
face-21 = []
# Issue #21のF1。ADXL345のtap検出を設定し、`INT_SOURCE`をI2Cで読んで、bootのACK後に`tapped`を送る（`src/main.rs`）。
# 製品buildもこの経路を持つ。`face-21`・`bringup-display-13`とも組み合わせられる。
tap-21 = []
# Issue #23のPROTO-TBD-007（LCD layoutとmemory測定）用。health snapshotと同じ周期で、空きheap、
# 起動からの最小の空きheap、main taskのstackのhigh water markを1行logへ出す（`src/mem_probe.rs`）。
# **logを足すだけで、LCD・Pi link・tapの挙動は変えない。製品buildには入らない。**ESP-IDFの統計を読むAPIは
# すべて`unsafe`であり、この featureのときだけ`main.rs`の`unsafe_code`が`deny`へ下がる（下の`unsafe_code`の注記）。
# featureを1つでも指定すると製品経路のcfgが外れるため、製品buildと同じ構成で測るときは
# `face-21`と`tap-21`を足す（タッチの撫での判定は製品buildだけが持ち、この構成には入らない）。`bench-servo-test-17`・`env-sample-16`・`accel-sample-15`・
# `touch-sample-14`・`touch-lcd-14`・`bringup-i2c-15-16`・`bringup-led-514`とは併用できない（`main.rs`の`compile_error!`）。
mem-probe-23 = []
# Issue #19の受け入れ条件3。UART0のconsoleから`MOTION <name> <target>`の行を読み、Pi由来の`play_motion`と同じ
# `MotionDispatch`のcatalogへ渡す（`src/debug_motion.rs`）。**製品buildには入らない**（既定buildはfeatureなし）。
# servoを駆動せず、`LimitedServo`も`Limiter`も作らない。catalogが空のため、debugの指示も全て拒否される。Pi linkを持つ。
# `bench-servo-test-17`・`touch-sample-14`・`touch-lcd-14`・`mem-probe-23`・`env-sample-16`・`accel-sample-15`・
# `bringup-i2c-15-16`・`bringup-led-514`とは併用できない（`main.rs`の`compile_error!`）。
debug-motion-19 = []
# Issue #14 の `TOUCH-01`（XPT2046）の raw 読み出し専用。SPI3（GPIO18/23/19）で X・Y・Z1・Z2 を読み、`TOUCH-IRQ`（GPIO34）の level とあわせて
# UART0 に出す。LCD は初期化せず（`LCD-CS` を High に固定するだけ）、状態機械は配線しない（`src/touch.rs`）。単独の試験 build として使う。
touch-sample-14 = []
# Issue #14 の受け入れ条件「LCD 通信による許容できない data loss がない」の観察用。LCD を初期化して点灯し、表情を帯ごとに塗り続けながら、
# 同じ SPI host（SPI3）で `TOUCH-01` の raw を読む（`src/touch_lcd.rs`）。LCD とタッチは `SpiDriver` を共有し、bus は転送ごとに取る。
# 製品 build も同じ型で、bus を握り続ける型は `touch-sample-14` だけ。単独の試験 build として使う。
touch-lcd-14 = []

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
# host workspaceのprotocol crateをpath dependencyで再利用する（ADR-0008）。
# root workspaceの`exclude = ["firmware/esp32"]`は維持したまま、依存だけを張る。
# lockfileは`firmware/esp32/Cargo.lock`とroot `Cargo.lock`の2つに分かれたままでよい。
deskcat-protocol = { path = "../../crates/deskcat-protocol" }
# servoのhard limitとtrajectory limitingを、hostと同じ実装で強制する（ADR-0008の追記、#19）。
# `bench-servo-test-17`付きのbuildを除くbuildで、`crate::servo`を通って角度を出せるのは、`Sg90`とこのcrateの`Limiter`を
# 1つずつ所有する`crate::servo::LimitedServo`だけである（成立の条件は`src/servo.rs`のmodule doc）。
deskcat-servo = { path = "../../crates/deskcat-servo" }
# `set_expression`の3表情の図形と、受理の判定の順序（#21）。LCDもSPIも知らず、hostでtestできる。
deskcat-face = { path = "../../crates/deskcat-face" }
# `accel-sample-15`のADXL345連続測定の設定値・復号・統計（#15）。I2Cを知らず、hostでtestできる。
deskcat-accel = { path = "../../crates/deskcat-accel" }
# ADXL345のtap検出の設定値と`tapped`の送出条件（#21のF1）。I2Cを知らず、hostでtestできる。
deskcat-tap = { path = "../../crates/deskcat-tap" }
deskcat-env = { path = "../../crates/deskcat-env" }
# XPT2046 の制御 byte と 3 byte 応答の復号（#14）。SPI を知らず、host で test できる。
deskcat-touch = { path = "../../crates/deskcat-touch" }
log = "0.4"
# health snapshotを`deskcat-protocol`の`Status`と同じ形へserializeするために使う。
# 同crateが既に依存しており、`firmware/esp32/Cargo.lock`にも推移的に入っている。
serde_json = "1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

# **`unsafe_code`の水準は`[lints.rust]`では持たない。**`src/main.rs`の先頭の`cfg_attr`が持つ。
# featureなしのbuild（製品build）は`forbid(unsafe_code)`で、これまでと同じである。`mem-probe-23`を
# 付けたbuildだけが`deny`へ下げ、`src/mem_probe.rs`の`unsafe`を許す（#23。理由は同fileのmodule doc）。
# `forbid`は`allow`で局所的に下げられないため、manifestの`[lints.rust]`には置けない。

[build-dependencies]
embuild = "0.33"
