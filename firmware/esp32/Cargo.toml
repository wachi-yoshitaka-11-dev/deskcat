[package]
name = "deskcat-esp32"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"
license = "MIT"
publish = false

[[bin]]
name = "deskcat-esp32"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[features]
default = []
# UART0をdebug log用ではなくPi-ESP32 protocol stream用に使うbuild。既定では無効
# （debug logモード）。詳細は`docs/hardware/gpio-assignment.md`「信号inventory」の
# `UART-TX`／`UART-RX`行、`#446`参照。
pi-protocol-mode = []
# Issue #17の単発servo bench試験だけを有効にする。既定ではoffであり、
# 通常のbuildはこのfeatureを持たず`crate::servo`を呼ばない。承認の状態は
# `docs/hardware/servo-safety-limits.md`の`承認の状態`節を参照する（ここへ再掲しない。
# `main.rs`のmodule doc、`servo.rs`のmodule doc参照）。
# **`pi-protocol-mode`と同時に有効にした構成は意図的にcompileできない。**
# `main.rs`が`compile_error!`で拒否する。理由は、servoのbench試験経路の呼び出しが
# `#[cfg(not(feature = "pi-protocol-mode"))]`のblockの中にあり、`pi-protocol-mode`では
# 呼ばれないため、featureが黙って無効になることである。両方を同時に有効にするbuildは
# 作らない。
# **#474で、このfeatureは単独で有効にしてもcompileが止まる**（`main.rs`の`compile_error!`）。
bench-servo-test-17 = []
# Issue #13の`DISP-01`（MSP2807）bring-up（controller識別、backlight点灯、単色fill、
# 四隅pattern）だけを有効にする。既定ではoffであり、通常のbuildは`run_display_bringup`を
# 呼ばず、`LCD-BL`（GPIO4）を含むLCD関連pinへ一切触れない。既定offにした理由と、
# 有効化してよい条件・手順は`main.rs`のmodule docの
# 「`DISP-01`のbring-upを有効にする手順」節を参照する（ここへ再掲しない）。
# **`pi-protocol-mode`と同時に有効にした構成は意図的にcompileできない。**
# `main.rs`が`compile_error!`で拒否する。理由は`bench-servo-test-17`と同じで、
# `run_display_bringup`の呼び出しが`#[cfg(not(feature = "pi-protocol-mode"))]`の
# blockの中にあり、`pi-protocol-mode`では呼ばれないため、featureが黙って無効に
# なることである。
bringup-display-13 = []

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
# host workspaceのprotocol crateをpath dependencyで再利用する（ADR-0008）。
# root workspaceの`exclude = ["firmware/esp32"]`は維持したまま、依存だけを張る。
# lockfileは`firmware/esp32/Cargo.lock`とroot `Cargo.lock`の2つに分かれたままでよい。
deskcat-protocol = { path = "../../crates/deskcat-protocol" }
log = "0.4"
# health snapshotを`deskcat-protocol`の`Status`と同じ形へserializeするために使う。
# 同crateが既に依存しており、`firmware/esp32/Cargo.lock`にも推移的に入っている。
serde_json = "1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
embuild = "0.33"
