[package]
name = "deskcatd"
version = "0.1.0"
description = "Raspberry Pi側のservice。接触eventから表情を決め、ESP32へ送る"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "deskcatd"
path = "src/main.rs"
# libraryと同名のため、docの出力が衝突する。
doc = false

[dependencies]
deskcat-domain = { path = "../../crates/deskcat-domain" }
deskcat-face = { path = "../../crates/deskcat-face" }
deskcat-protocol = { path = "../../crates/deskcat-protocol" }
deskcat-serial = { path = "../../crates/deskcat-serial" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "=3.4.1", default-features = false, features = ["json", "native-tls"] }
# **facadeだけに依存する。**loggerの実装はbinary側が選ぶ（`deskcat-serial`と同じ方針）。
log = "0.4"

[dev-dependencies]
# `deskcat-serial`と同じcrate・version・feature。`SerialPort::pair()`のPTYをtestから使うため。
# 根拠は`crates/deskcat-serial/Cargo.toml`。
serial2 = { version = "0.2.38", features = ["unix"] }

[lints]
workspace = true
