[package]
name = "deskcat-servo"
version = "0.1.0"
description = "Servoのhard limit強制とtrajectory limiting（値を持たない純粋なlogic）"
edition.workspace = true
# workspaceの`rust-version`を継承しない。このcrateは`firmware/esp32`からもpath dependencyで
# 使うため（ADR-0008の追記）、`deskcat-protocol`と同じく、host（1.97.1）とESP toolchain
# （`esp-1.95.0.0` = rustc 1.95.0-nightly）の両方を満たす下限を宣言する。
#
# 宣言した1.95は、その版で実際にbuildとtestを通した結果である
# （docs/toolchains/version-records/2026-09-29-esp32-build-servo-limiter-native-linux.md）。
# 上げるときはESP toolchainの版と同時に判断する。
rust-version = "1.95"
license.workspace = true
publish.workspace = true

[dependencies]
# reject理由をwire error codeへ対応づけるため（Protocol §5.3・§7）と、duplicate履歴（§8手順8、§9）を使うためだけに依る。
# **このcrateはwire messageのencode／decodeを行わない。**
deskcat-protocol = { path = "../deskcat-protocol" }

[lints]
workspace = true
